# XAHBall release build: cross-compiles the m68k binary in the
# mirqq/amiga-development docker image (Bartman toolchain + ACE host tools
# environment), packs an LHA + ZIP and publishes them.
#
# Triggers:
#  - every push to main            -> build + artifact
#  - tags (v* / 0.*)               -> build + artifact + GitHub release
#  - workflow_dispatch (manual)    -> build + artifact
#  - FTP upload happens only when FTP_HOST/FTP_USER/FTP_PASS secrets are set.
#
# Pinned dependency: ACE @ 1d09ead6dec16eb343a1677eadd25862a20171e8
# (matches the local dev clone; the repo ships deps/ace as a dev-only symlink
# to an absolute path, which the CI step below replaces with this checkout).

name: release

on:
  push:
    branches: [main]
    tags: ['v*', '0.*']
  workflow_dispatch:

env:
  ACE_PIN: 1d09ead6dec16eb343a1677eadd25862a20171e8
  EXT_PATH: /home/amiga/.vscode/extensions/bartmanabyss.amiga-debug-1.7.9
  FTP_HOST: ${{ secrets.FTP_HOST }}
  FTP_USER: ${{ secrets.FTP_USER }}
  FTP_PASS: ${{ secrets.FTP_PASS }}

jobs:
  build:
    name: Build Amiga release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace dev-only ACE symlink with pinned checkout
        run: |
          rm game/deps/ace
          git clone --depth 1 https://github.com/AmigaPorts/ACE game/deps/ace
          git -C game/deps/ace checkout "$ACE_PIN"
          # local fixes: audio_conv SIGFPE on -fpt (divide by zero) + pad logic
          git apply tools/patches/ace-local.patch

      - name: Prepare workspace permissions (docker writes as root)
        run: chmod -R 777 .

      - name: Build ACE host asset tools
        uses: docker://mirqqq/amiga-development:v0.4
        with:
          args: >
            /bin/sh -c "cd game/deps/ace/tools &&
            mkdir -p build && cd build &&
            cmake .. -DCMAKE_C_COMPILER=gcc &&
            cmake --build . -j 6"

      - name: Build game (m68k cross + asset conversion)
        uses: docker://mirqqq/amiga-development:v0.4
        with:
          args: >
            /bin/sh -c "cmake -B /github/workspace/game-build -S game
            -DVSCODE_AMIGA_EXTENSION_PATH=$EXT_PATH
            -DCMAKE_TOOLCHAIN_FILE=/github/workspace/AmigaCMakeCrossToolchains/m68k-bartman.cmake
            -DM68K_CPU=68000 &&
            cmake --build /github/workspace/game-build -j 6"

      - name: Assemble dist folder
        run: |
          mkdir -p out/xahball
          cp -r game-build/dist/. out/xahball/
          cp tools/dist-README.txt out/xahball/README-INSTALL.txt
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Pack LHA + ZIP
        uses: docker://mirqqq/amiga-development:v0.4
        with:
          args: >
            /bin/sh -c "cd out &&
            lha a xahball.lha xahball > /dev/null &&
            lha t xahball.lha"

      - name: Pack ZIP (host)
        run: cd out && zip -rq xahball.zip xahball

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xahball-${{ env.SHORT_SHA }}
          path: |
            out/xahball.lha
            out/xahball.zip

      - name: Attach to GitHub release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/xahball.lha
            out/xahball.zip

      - name: Push to FTP (only when secrets are configured)
        if: ${{ env.FTP_HOST != '' }}
        run: |
          for f in out/xahball.lha out/xahball.zip; do
            curl -s --ftp-pasv -T "$f" \
              "ftp://$FTP_USER:$FTP_PASS@$FTP_HOST/PUBLIC/$(basename "$f")" \
              && echo "uploaded: PUBLIC/$(basename "$f")"
          done
